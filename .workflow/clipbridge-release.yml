version: "1.0"
name: clipbridge-release
displayName: ClipBridge 发布入口说明
stages:
  - name: notice
    displayName: 正式发布已迁移到云端 Windows 构建
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: release_notice
        displayName: 查看新的发布方式
        commands: |-
          echo "Windows packaging now runs in the private GitHub source repository."
          echo "Use Actions > Publish to Gitee. This workflow does not publish."
strategy:
  timeout: 5
  cloneDepth: 1

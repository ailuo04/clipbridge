version: "1.0"
name: clipbridge-release
displayName: ClipBridge 安全发布
stages:
  - name: validate
    displayName: 校验签名和发布文件
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: verify_release_files
        displayName: 验证更新清单、ZIP 和安装器
        commands: |-
          set -eu
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile, zipfile
          from pathlib import Path

          version = '0.3.6'
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid RELEASE_VERSION')
          envelope = json.loads(Path('latest-v2.json').read_text(encoding='utf-8'))
          payload = base64.b64decode(envelope['payload'], validate=True)
          signature = base64.b64decode(envelope['signature'], validate=True)
          public_key = base64.b64decode('', validate=True)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / 'key.der').write_bytes(public_key)
              (root / 'payload').write_bytes(payload)
              (root / 'signature').write_bytes(signature)
              subprocess.run(['openssl', 'pkey', '-pubin', '-inform', 'DER', '-in', str(root / 'key.der'), '-out', str(root / 'key.pem')], check=True)
              subprocess.run(['openssl', 'dgst', '-sha256', '-verify', str(root / 'key.pem'), '-signature', str(root / 'signature'), str(root / 'payload')], check=True)
          data = json.loads(payload)
          win = data['windows']
          if data['schema'] != 1 or win['version'] != version:
              raise SystemExit('Manifest schema or version does not match')
          base = 'https://gitee.com/ailuo047/huchuan/raw/master/'
          zip_name = f'ClipBridge-{version}-win-x64.zip'
          setup_name = f'ClipBridge-{version}-win-x64-Setup.exe'
          for name, size, digest, url in (
              (zip_name, win['size'], win['sha256'], win['url']),
              (setup_name, win['installerSize'], win['installerSha256'], win['installerUrl']),
          ):
              path = Path(name)
              if not path.is_file() or path.stat().st_size != size or url != base + name:
                  raise SystemExit(f'File, size, or URL mismatch: {name}')
              actual = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      actual.update(chunk)
              if actual.hexdigest().lower() != digest.lower():
                  raise SystemExit(f'SHA-256 mismatch: {name}')
              print(f'PASS {name}')
          with zipfile.ZipFile(zip_name) as archive:
              required = {'ClipBridge.exe', 'ClipBridge.dll', 'ClipBridge.deps.json', 'ClipBridge.runtimeconfig.json'}
              if set(archive.namelist()) != required or archive.testzip() is not None:
                  raise SystemExit('Update ZIP entries invalid')
          print('PASS signed manifest, package hashes and ZIP contents')
          PY
  - name: publish
    displayName: 创建 Gitee 发行版
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: release@gitee
        name: publish_release
        displayName: 发布安装器附件
        releaseName: "ClipBridge / 互传 0.3.6"
        description: "Windows 更新说明请参阅仓库 README。0.3.5 或更早版本因旧更新签名私钥丢失，需要手动安装支持新密钥的版本后才能使用新更新渠道。安装器未进行 Authenticode 代码签名。"
        tagName: "v0.3.6"
        upstreamArtifact: []
        assertFiles:
          - "./ClipBridge-0.3.6-win-x64-Setup.exe"
        prerelease: false
        allowUpdate: false
strategy:
  timeout: 20
  cloneDepth: 1

version: "1.0"
name: clipbridge-cloud-relay
displayName: ClipBridge 云端安装包中转
stages:
  - name: fetch_and_publish
    displayName: 校验云端产物并上传发行版附件
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: fetch_signed_bundle
        displayName: 下载并校验已签名公开产物
        commands: |-
          set -eu
          python3 -u - <<'PY'
          import base64,hashlib,json,subprocess,tempfile,urllib.request,zipfile
          from pathlib import Path
          cfg=json.loads(base64.b64decode(''))
          version=cfg['version']
          setup='ClipBridge-'+version+'-win-x64-Setup.exe'
          zipname='ClipBridge-'+version+'-win-x64.zip'
          archive=Path('github-release-bundle.zip')
          with urllib.request.urlopen(cfg['url'],timeout=300) as source,archive.open('wb') as output:
              total=0
              while True:
                  chunk=source.read(1024*1024)
                  if not chunk: break
                  total+=len(chunk)
                  if total>100*1024*1024: raise RuntimeError('Artifact exceeds size limit')
                  output.write(chunk)
                  if total//(16*1024*1024)!=(total-len(chunk))//(16*1024*1024): print('Downloaded',total,'binary bytes',flush=True)
          print('Downloaded binary-only cloud artifact',total,'bytes')
          if cfg['archive_digest']:
              if 'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()!=cfg['archive_digest']: raise RuntimeError('Artifact archive digest mismatch')
          with zipfile.ZipFile(archive) as bundle:
              expected={setup,zipname,'latest-v2.json','manifest-'+version+'.json','release-notes.txt'}
              if set(bundle.namelist())!=expected: raise RuntimeError('Unexpected artifact file list')
              envelope=bundle.read('latest-v2.json')
              if hashlib.sha256(envelope).hexdigest()!=cfg['manifest_sha256']: raise RuntimeError('Manifest mismatch')
              if Path('manifest-'+version+'.json').read_bytes()!=envelope: raise RuntimeError('Repository version manifest mismatch')
              decoded=json.loads(envelope)
              payload=base64.b64decode(decoded['payload'],validate=True)
              signature=base64.b64decode(decoded['signature'],validate=True)
              with tempfile.TemporaryDirectory() as temp:
                  p=Path(temp)
                  (p/'key.der').write_bytes(base64.b64decode(cfg['public_key'],validate=True))
                  (p/'payload').write_bytes(payload)
                  (p/'signature').write_bytes(signature)
                  subprocess.run(['openssl','pkey','-pubin','-inform','DER','-in',str(p/'key.der'),'-out',str(p/'key.pem')],check=True)
                  subprocess.run(['openssl','dgst','-sha256','-verify',str(p/'key.pem'),'-signature',str(p/'signature'),str(p/'payload')],check=True)
              if json.loads(payload)['windows']!=cfg['win']: raise RuntimeError('Signed release fields mismatch')
              for name,size,digest in [(setup,cfg['win']['installerSize'],cfg['win']['installerSha256']),(zipname,cfg['win']['size'],cfg['win']['sha256'])]:
                  if bundle.getinfo(name).file_size!=size: raise RuntimeError('Artifact size mismatch')
                  actual=hashlib.sha256()
                  with bundle.open(name) as source,Path(name).open('wb') as output:
                      for chunk in iter(lambda:source.read(1024*1024),b''):
                          actual.update(chunk)
                          output.write(chunk)
                  if actual.hexdigest()!=digest: raise RuntimeError('Artifact SHA-256 mismatch')
                  print('PASS',name,'size and SHA-256')
          print('PASS signed manifest and staged Setup')
          PY
        artifacts:
          - name: CLIPBRIDGE_SETUP
            path:
              - "./ClipBridge-0.3.6-win-x64-Setup.exe"
            type: .tar.gz
  - name: attach_setup
    displayName: 上传已校验发行版附件
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: release@gitee
        name: attach_verified_setup
        displayName: 将已校验安装包上传发行版
        releaseName: "ClipBridge / 互传 0.3.6"
        description: "./release-description-0.3.6.md"
        tagName: "v0.3.6"
        upstreamArtifact:
          - "${CLIPBRIDGE_SETUP}"
        assertFiles:
          - "./ClipBridge-0.3.6-win-x64-Setup.exe"
        prerelease: true
        allowUpdate: true
strategy:
  timeout: 20
  cloneDepth: 1

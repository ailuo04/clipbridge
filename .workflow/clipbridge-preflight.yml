version: "1.0"
name: clipbridge-release-preflight
displayName: ClipBridge 发布环境检查
stages:
  - name: preflight
    displayName: 验证公开仓库和构建工具
    strategy: naturally
    trigger: auto
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: release_preflight
        displayName: 检查运行环境（不发布）
        commands: |-
          set -eu
          echo "Checking the public release repository and runner tools."
          test -f README.md
          test -f latest.json
          python3 --version
          openssl version
          git --version
          echo "Preflight only: no artifacts, tags, manifests or releases will be published."
strategy:
  timeout: 10
  cloneDepth: 1

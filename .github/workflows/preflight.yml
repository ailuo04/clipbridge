name: ClipBridge preflight

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build application and smoke-test projects
        shell: pwsh
        run: |
          dotnet build ClipBridge.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Build or test command failed: $LASTEXITCODE" }
          dotnet build tools/UiSmokeTests/UiSmokeTests.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Build or test command failed: $LASTEXITCODE" }
          dotnet build tools/UpdateSmokeTests/UpdateSmokeTests.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Build or test command failed: $LASTEXITCODE" }
      - name: Verify shared brand icon
        shell: pwsh
        run: '& tools/Test-BrandIcon.ps1'
      - name: Run transfer protocol tests
        shell: pwsh
        run: dotnet run --project tools/TransferTests/TransferTests.csproj --configuration Release
      - name: Test release publisher
        shell: pwsh
        run: python -m unittest discover -s tools -p 'test_publish_github.py'
      - name: Verify package layout and updater helper
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p 'test_release_layout.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release layout tests failed.' }
          dotnet run --project tools/UpdateSmokeTests/UpdateSmokeTests.csproj --configuration Release -- --verify-helper
          if ($LASTEXITCODE -ne 0) { throw 'Updater helper smoke test failed.' }
